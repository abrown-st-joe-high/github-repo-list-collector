<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repo link pairs</title>
<style>
:root{
  --bg:#f3f5f2; --panel:#ffffff; --ink:#1c2a24; --muted:#5d6b64; --line:#d5dcd6;
  --accent:#1f6f54; --accent-ink:#ffffff; --pages:#2d4f9e; --danger:#a33a3a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --panel:#1b2420; --ink:#e6eee9; --muted:#97a69d; --line:#2c3933;
    --accent:#4cc79a; --accent-ink:#0c1a14; --pages:#8fb0ff; --danger:#ef8a8a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input[type=text]:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,.btn{font:inherit;padding:9px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3}
button.ghost,.btn.ghost{background:transparent;color:var(--accent)}
button.small,.btn.small{padding:5px 10px;font-size:.85rem}
.import{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.import label{display:inline;margin:0;color:var(--ink)}
.msg{min-height:1.4em;margin:10px 0 0;font-size:.9rem;color:var(--muted)}
.msg.err{color:var(--danger)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}
.bar h2{margin:0;font-size:1.15rem}
.pair{margin-bottom:14px}
.pair-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pair-head strong{font-size:1.05rem}
.pair-head button{border-color:var(--line);background:transparent;color:var(--muted)}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border:1px solid var(--line);border-left-width:5px;border-radius:8px;padding:12px;background:var(--bg);min-width:0}
.box.repo{border-left-color:var(--accent)}
.box.pages{border-left-color:var(--pages)}
.box h3{margin:0 0 4px;font-size:.9rem;color:var(--muted);font-weight:600}
.url{word-break:break-all;font-family:Consolas,Menlo,monospace;font-size:.88rem;margin:0 0 10px}
.acts{display:flex;gap:8px}
.empty{color:var(--muted);text-align:center;padding:28px}
@media (max-width:680px){.form,.boxes{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Repo link pairs</h1>
  <p class="sub">Enter a GitHub username and a repo name to get the repo page and GitHub Pages links side by side.</p>

  <div class="panel">
    <div class="form">
      <div><label for="user">GitHub username</label><input id="user" type="text" placeholder="octocat" autocomplete="off"></div>
      <div><label for="repo">New repo name</label><input id="repo" type="text" placeholder="my-project" autocomplete="off"></div>
      <button id="add">Generate links</button>
    </div>
    <div class="import">
      <button id="scrape" class="ghost">Import all repos for this username</button>
      <span><input type="checkbox" id="pagesOnly"> <label for="pagesOnly">Only repos with Pages enabled</label></span>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </div>

  <div class="bar">
    <h2 id="count">Saved links</h2>
    <button id="clear" class="ghost small">Clear all</button>
  </div>
  <div id="list"></div>
</main>

<script>
(function(){
  var KEY = "repoLinkPairs";
  var items = [];
  var $ = function(id){return document.getElementById(id);};

  function load(){
    try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){ items = []; }
    if (!Array.isArray(items)) items = [];
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){}
  }
  function say(text, err){
    var m = $("msg"); m.textContent = text; m.className = "msg" + (err ? " err" : "");
  }
  function repoUrl(u, r){ return "https://github.com/" + u + "/" + r; }
  function pagesUrl(u, r){
    var site = (u + ".github.io").toLowerCase();
    if (r.toLowerCase() === site) return "https://" + site + "/";
    return "https://" + site + "/" + r + "/";
  }
  function clean(s){ return s.trim().replace(/^@/, "").replace(/\s+/g, "-"); }
  var valid = /^[A-Za-z0-9._-]+$/;

  function addItem(u, r){
    var exists = items.some(function(i){ return i.user.toLowerCase() === u.toLowerCase() && i.repo.toLowerCase() === r.toLowerCase(); });
    if (exists) return false;
    items.unshift({user:u, repo:r});
    return true;
  }

  function copy(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
    function fallback(){
      var t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); done(); } catch(e){}
      document.body.removeChild(t);
    }
  }

  function box(kind, title, url){
    var d = document.createElement("div"); d.className = "box " + kind;
    var h = document.createElement("h3"); h.textContent = title;
    var p = document.createElement("p"); p.className = "url"; p.textContent = url;
    var a = document.createElement("div"); a.className = "acts";
    var c = document.createElement("button"); c.className = "small"; c.textContent = "Copy";
    c.onclick = function(){ copy(url, c); };
    var v = document.createElement("a"); v.className = "btn ghost small"; v.href = url; v.target = "_blank"; v.rel = "noopener"; v.textContent = "Visit page";
    a.appendChild(c); a.appendChild(v);
    d.appendChild(h); d.appendChild(p); d.appendChild(a);
    return d;
  }

  function render(){
    var list = $("list"); list.innerHTML = "";
    $("count").textContent = "Saved links (" + items.length + ")";
    $("clear").style.display = items.length ? "" : "none";
    if (!items.length){
      var e = document.createElement("div"); e.className = "panel empty";
      e.textContent = "Nothing saved yet. Generate a pair above or import a user's repos.";
      list.appendChild(e); return;
    }
    items.forEach(function(it, idx){
      var w = document.createElement("div"); w.className = "panel pair";
      var hd = document.createElement("div"); hd.className = "pair-head";
      var s = document.createElement("strong"); s.textContent = it.user + "/" + it.repo;
      var x = document.createElement("button"); x.className = "small"; x.textContent = "Remove";
      x.onclick = function(){ items.splice(idx, 1); save(); render(); };
      hd.appendChild(s); hd.appendChild(x);
      var g = document.createElement("div"); g.className = "boxes";
      g.appendChild(box("repo", "Repo page", repoUrl(it.user, it.repo)));
      g.appendChild(box("pages", "GitHub Pages", pagesUrl(it.user, it.repo)));
      w.appendChild(hd); w.appendChild(g); list.appendChild(w);
    });
  }

  $("add").onclick = function(){
    var u = clean($("user").value), r = clean($("repo").value);
    if (!u || !r){ say("Enter both a username and a repo name.", true); return; }
    if (!valid.test(u) || !valid.test(r)){ say("Names can only use letters, numbers, dots, dashes and underscores.", true); return; }
    if (addItem(u, r)){ save(); render(); say("Added " + u + "/" + r + "."); $("repo").value = ""; $("repo").focus(); }
    else say(u + "/" + r + " is already saved.", true);
  };
  $("repo").addEventListener("keydown", function(e){ if (e.key === "Enter") $("add").click(); });

  $("scrape").onclick = async function(){
    var u = clean($("user").value);
    if (!u || !valid.test(u)){ say("Enter a valid GitHub username first.", true); return; }
    var btn = $("scrape"); btn.disabled = true; say("Fetching repos for " + u + "...");
    try {
      var all = [], page = 1;
      while (page <= 10){
        var res = await fetch("https://api.github.com/users/" + encodeURIComponent(u) + "/repos?per_page=100&page=" + page);
        if (res.status === 404) throw new Error("No GitHub user named " + u + ".");
        if (res.status === 403) throw new Error("GitHub rate limit reached. Try again in a few minutes.");
        if (!res.ok) throw new Error("GitHub returned an error (" + res.status + ").");
        var data = await res.json();
        all = all.concat(data);
        if (data.length < 100) break;
        page++;
      }
      var only = $("pagesOnly").checked;
      var added = 0;
      all.filter(function(r){ return !only || r.has_pages; }).reverse().forEach(function(r){
        if (addItem(r.owner.login, r.name)) added++;
      });
      save(); render();
      say("Found " + all.length + " repos. Added " + added + " new pair" + (added === 1 ? "" : "s") + ".");
    } catch (err){
      say(err.message || "Could not reach GitHub.", true);
    }
    btn.disabled = false;
  };

  $("clear").onclick = function(){
    if (confirm("Remove all saved link pairs?")){ items = []; save(); render(); say(""); }
  };

  load(); render();
})();
</script>
</body>
</html>
